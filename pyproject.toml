[project]
name = "boletos-em-lote"
version = "0.1.0"
description = "Emissão de boletos em lote a partir de planilha, com e-mail redigido pelo Claude e aprovação humana antes do envio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "anthropic>=1.0,<2",
]

[project.scripts]
boletos = "boletos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boletos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not sandbox and not claude_real'"
markers = [
    "unit: teste de uma unidade, sem I/O externo",
    "integration: fluxo com banco e gateway simulado",
    "sandbox: fala com o sandbox real do Asaas (fora do CI)",
    "claude_real: chama a API real do Claude (fora do CI)",
]

[tool.ruff]
line-length = 120
# o ruff 0.17 também formata blocos de código dentro de .md; os documentos não entram
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer usa Option/Argument como valor padrão por design
extend-immutable-calls = ["typer.Argument", "typer.Option"]
